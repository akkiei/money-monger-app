name: EAS Android (build + submit)

# Manual only: EAS builds are slow and consume metered build credits, so we
# don't run them on every push. Trigger from Actions → "EAS Android" → Run workflow.
#
#   profile = production → AAB for the Play Store (submit to the internal track)
#   profile = preview    → installable APK for quick on-device testing (never submits)
#
# FIRST TIME: set submit = false. Play Console rejects API uploads until the app
# exists with one AAB uploaded manually. Build once here, upload that AAB to the
# internal track by hand, link the service account, then future runs can submit.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [production, preview]
        default: production
      submit:
        description: "Submit to Play Store internal track (production only)"
        type: boolean
        default: true

defaults:
  run:
    working-directory: money-monger

jobs:
  build:
    name: Build & submit Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: money-monger/package-lock.json

      - run: npm ci

      # fail fast on the cheap runner before spending EAS build minutes
      - run: npm run typecheck

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The submit config (eas.json) points at ./google-service-account.json.
      # Materialise it from the secret only when we're going to submit.
      - name: Write Google service-account key
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json

      - name: Build (and submit) with EAS
        run: |
          if [ "${{ inputs.submit }}" = "true" ] && [ "${{ inputs.profile }}" = "production" ]; then
            eas build --platform android --profile production --non-interactive --auto-submit
          else
            eas build --platform android --profile ${{ inputs.profile }} --non-interactive
          fi

      - name: Clean up service-account key
        if: always()
        run: rm -f google-service-account.json
