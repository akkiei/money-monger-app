name: Deploy Web (Vercel)

# Auto-deploy the Expo web build to Vercel on push:
#   main    → Production (https://money-monger.vercel.app)
#   develop → Preview (staging URL, commented on the commit)
#
# Uses the akkiei account via a scoped token — no Vercel Git integration, no
# website clicks. Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
on:
  push:
    branches: [main, develop]

# A newer push to the same branch supersedes an in-flight deploy.
concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

defaults:
  run:
    working-directory: money-monger

jobs:
  deploy:
    name: Build & deploy web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # main → production target; any other branch (develop) → preview
      - name: Resolve target
        id: t
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel project settings + env
        run: vercel pull --yes --environment=${{ steps.t.outputs.environment }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build (expo export -p web via vercel.json)
        run: vercel build ${{ steps.t.outputs.prod }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact
        run: vercel deploy --prebuilt ${{ steps.t.outputs.prod }} --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
